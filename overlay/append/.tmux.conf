# --- nonreagent overlay (exe.dev) ---
# Upstream also sets `mouse on`; this is the knob to flip back to `off` if mouse
# reporting ever fights programmatic copy/paste in agent terminals again (that
# was a663bb3's reason for disabling it).
set -g mouse on

# Claude Code publishes a live per-session topic (and a busy/idle glyph) as the
# pane title via OSC 2. tmux's automatic-rename only ever sees the process name,
# so every agent window reads "claude". Read the pane title instead — but only
# for claude panes tmux is still auto-naming, so an explicit `rename-window` and
# any non-agent window keep the name they were given.
set -g @cc_wname '#{?#{==:#{pane_current_command},claude},#{?automatic-rename,#{=/22/…:pane_title},#W},#W}'
setw -g window-status-current-format '#[fg=colour81,bg=colour238] #I#[fg=colour250] #[fg=colour255]#{E:@cc_wname}#[fg=colour81]#F '
setw -g window-status-format '#[fg=colour138,bg=colour237] #I #[fg=colour250]#{E:@cc_wname}#[fg=colour244]#F '
